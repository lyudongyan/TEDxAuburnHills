name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - website/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify participating search engines
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --request POST \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data '{
              "host": "lyudongyan.github.io",
              "key": "fc6fc623039e4aa8b4be9770e33b8586",
              "keyLocation": "https://lyudongyan.github.io/TEDxAuburnHills/fc6fc623039e4aa8b4be9770e33b8586.txt",
              "urlList": [
                "https://lyudongyan.github.io/TEDxAuburnHills/",
                "https://lyudongyan.github.io/TEDxAuburnHills/speakers.html",
                "https://lyudongyan.github.io/TEDxAuburnHills/schedule.html",
                "https://lyudongyan.github.io/TEDxAuburnHills/attend.html",
                "https://lyudongyan.github.io/TEDxAuburnHills/team.html"
              ]
            }' \
            https://api.indexnow.org/indexnow
